<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PartyLink | 管理後台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-body">
    <div class="container wide">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-badge" aria-label="Let's Hang">🎉</div>
          <div>
            <div class="brand-name">Let's Hang</div>
            <div class="brand-subtitle">活動總覽</div>
          </div>
        </div>
        <button id="logoutBtn" class="secondary-btn">登出</button>
      </header>

      <main class="admin-shell">
        <section class="panel admin-panel">
          <div class="section-heading compact">
            <span class="eyebrow">LEGACY VIEW</span>
            <h1>活動總覽</h1>
          </div>
          <div id="eventList" class="event-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
